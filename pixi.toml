# is present, which breaks tf.keras/tensorflow_hub: the conda-forge jaxlib 0.5.x builds request an
# executable stack (refused by glibc >= 2.41), and the other builds abort with a protobuf descriptor
# conflict when loaded after the pip tensorflow.
