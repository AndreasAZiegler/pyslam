libegl-devel = "*"
libglx-devel = "*"
libgl = ">=1.7.0,<2"
libopengl = ">=1.7.0,<2"
libglu = ">=9.0.3,<10"
#
cython = "0.29.*"
#
cuda-compiler = "12.8.*"
cuda-toolkit = "12.8.*"
cudnn = "9.*"
#
metis = "*"
rerun-sdk = "*"
rattler-build = "*"
fast-pytorch-kmeans = "*"
