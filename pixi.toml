[target.linux-64.dependencies]
# conda-forge compilers used to build OpenCV/CUDA (and the other C++ code) instead of the
# system gcc/g++ (e.g. on Arch Linux). Pinned to a version supported by nvcc 12.8 (gcc <= 14).
gcc_linux-64 = "12.4.*"
gxx_linux-64 = "12.4.*"

[tool.pixi.pip-dependencies]
numba = "*"
onnxruntime = "*"
imgviz = "==1.2.6"
glfw = "*"
roma = "*"
pyqt5 = "*"
kornia = "==0.8.2"
kornia_moons = "==0.2.9"
#transformers = "==4.38.2" 
#f3rm = "*"                # conflict 
#timm = "==1.0.15"         # conflict 
#tensorflow = "==2.13"     # conflict 
#tensorflow-hub = "*"      # conflict 
#protobuf = ">=3.20"       # conflict 


[system-requirements]
cuda = "12.8"

[activation.env]
# The conda-forge cuda-nvcc activation script defaults TORCH_CUDA_ARCH_LIST to a list that
# contains "10.1", an arch name torch >= 2.9 no longer accepts (renamed to "11.0"): this breaks
# every torch CUDA extension build (e.g. detectron2) with "Unknown CUDA arch (10.1)".
# The activation script only sets it when unset, so define a torch-compatible list here.
TORCH_CUDA_ARCH_LIST = "5.0;5.2;6.0;6.1;7.0;7.5;8.0;8.6;8.9;9.0;10.0;12.0+PTX"
